; Blink experiment: proves the build, flash, config, and serial chain on a bare ESP32 board.
; An experiment is throwaway. It may use the piece's code and shared code, but nothing outside
; this folder may depend on it, so deleting experiments/ has no consequences.

[env:esp32dev]
; Same platform pin as the main project so experiments run on the toolchain the piece ships with.
platform = espressif32@8.0.0
board = esp32dev
framework = arduino
; The piece's own headers (Config, Secrets) and the shared layer, reached by relative path.
build_flags =
    -I../../include
    -I../../../shared/include
; Serial monitor speed. Must match serialBaudRate in SharedConfig.h (PlatformIO cannot read it).
monitor_speed = 115200
