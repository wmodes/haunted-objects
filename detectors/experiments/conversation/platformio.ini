; Conversation experiment: generates a heat-driven conversation between detector slots and renders
; it to a WAV file so the pause feel can be judged by ear. Host-only: no ESP32 involved.
; An experiment is throwaway. It may use the piece's code, but nothing outside this folder may
; depend on it, so deleting experiments/ has no consequences.

[env:native]
platform = native
; C++20 to match the toolchain the firmware ships with. The piece's include folder is reached by
; relative path so the real DetectorProfiles.h (the slots' voices) is used.
build_flags =
    -std=c++20
    -Wall
    -Wextra
    -I../../include
