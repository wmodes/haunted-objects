; Chirp-table experiment: renders the first few slots of the detector profile table to a WAV file
; so they can be heard on the development Mac. Host-only: no ESP32 involved.
; An experiment is throwaway. It may use the piece's code, but nothing outside this folder may
; depend on it, so deleting experiments/ has no consequences.

[env:native]
platform = native
; C++20 to match the toolchain the firmware ships with; the piece's headers use C++17 features.
; The piece's include folder is reached by relative path so the real DetectorProfiles.h is used.
build_flags =
    -std=c++20
    -Wall
    -Wextra
    -I../../include
